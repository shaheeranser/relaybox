services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relaybox
      POSTGRES_PASSWORD: relaybox
      POSTGRES_DB: relaybox
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaybox"]
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      RELAYBOX_API_TOKEN: ${RELAYBOX_API_TOKEN}
      RELAYBOX_DATABASE_URL: postgresql://relaybox:relaybox@db:5432/relaybox
      RELAYBOX_LOG_LEVEL: ${RELAYBOX_LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db:/app/db:ro

  worker:
    build: ./worker
    environment:
      RELAYBOX_DATABASE_URL: postgresql://relaybox:relaybox@db:5432/relaybox
      RELAYBOX_WORKER_CONCURRENCY: ${RELAYBOX_WORKER_CONCURRENCY:-8}
      RELAYBOX_MAX_ATTEMPTS: ${RELAYBOX_MAX_ATTEMPTS:-8}
      RELAYBOX_LEASE_SECONDS: ${RELAYBOX_LEASE_SECONDS:-60}
      RELAYBOX_HTTP_TIMEOUT: ${RELAYBOX_HTTP_TIMEOUT:-10}
      RELAYBOX_LOG_LEVEL: ${RELAYBOX_LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

  sink:
    build: ./sink
    ports:
      - "9000:9000"
    environment:
      SINK_STATUS_CODE: ${SINK_STATUS_CODE:-200}
      SINK_DELAY_MS: ${SINK_DELAY_MS:-0}

volumes:
  pgdata:

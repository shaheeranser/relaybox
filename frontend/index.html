<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relaybox Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <h1 class="text-3xl font-bold text-gray-900">Relaybox Dashboard</h1>
    
    <div class="bg-white p-6 rounded shadow">
      <h2 class="text-xl font-semibold mb-4">Configuration</h2>
      <div class="flex gap-4">
        <input type="password" id="api-token" placeholder="API Token (RELAYBOX_API_TOKEN)" class="border p-2 rounded w-full">
        <input type="text" id="api-url" value="http://localhost:8000" class="border p-2 rounded w-1/3" placeholder="API URL">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded shadow">
        <h2 class="text-xl font-semibold mb-4">Send Event</h2>
        <div class="space-y-4">
          <input type="text" id="ev-type" placeholder="Event Type (e.g., order.shipped)" class="border p-2 rounded w-full">
          <textarea id="ev-payload" placeholder='{"key": "value"}' class="border p-2 rounded w-full h-24 font-mono"></textarea>
          <button onclick="sendEvent()" class="bg-blue-600 text-white px-4 py-2 rounded">Send Event</button>
          <p id="ev-status" class="text-sm mt-2"></p>
        </div>
      </div>

      <div class="bg-white p-6 rounded shadow overflow-y-auto max-h-96">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold">Subscriptions</h2>
          <button onclick="loadSubs()" class="text-sm bg-gray-200 px-2 py-1 rounded">Refresh</button>
        </div>
        <ul id="subs-list" class="space-y-2 text-sm"></ul>
      </div>
    </div>

    <div class="bg-white p-6 rounded shadow">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Recent Deliveries</h2>
        <button onclick="loadDeliveries()" class="text-sm bg-gray-200 px-2 py-1 rounded">Refresh</button>
      </div>
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b"><th class="p-2">ID</th><th class="p-2">Status</th><th class="p-2">Attempts</th><th class="p-2">Action</th></tr>
        </thead>
        <tbody id="deliveries-list"></tbody>
      </table>
    </div>
  </div>

  <script>
    function getHeaders() {
      const token = document.getElementById('api-token').value;
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }
    const apiUrl = () => document.getElementById('api-url').value;

    async function sendEvent() {
      const statusEl = document.getElementById('ev-status');
      try {
        const type = document.getElementById('ev-type').value;
        const payload = JSON.parse(document.getElementById('ev-payload').value || '{}');
        const res = await fetch(`${apiUrl()}/v1/events`, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({ type, payload })
        });
        if (res.ok) {
          const data = await res.json();
          statusEl.innerText = `Sent! ID: ${data.event_id}, Deliveries: ${data.deliveries_created}`;
          statusEl.className = 'text-green-600 mt-2';
          setTimeout(loadDeliveries, 1000);
        } else {
          statusEl.innerText = `Error: ${res.statusText}`;
          statusEl.className = 'text-red-600 mt-2';
        }
      } catch (e) {
        statusEl.innerText = `Error: ${e.message}`;
        statusEl.className = 'text-red-600 mt-2';
      }
    }

    async function loadSubs() {
      try {
        const res = await fetch(`${apiUrl()}/v1/subscriptions`, { headers: getHeaders() });
        const subs = await res.json();
        document.getElementById('subs-list').innerHTML = (subs.length ? subs : []).map(s => `
          <li class="border p-2 rounded">
            <strong>${s.url}</strong><br>
            <span class="text-gray-500">Events: ${s.event_types.join(', ')}</span>
          </li>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function loadDeliveries() {
      try {
        const res = await fetch(`${apiUrl()}/v1/deliveries?limit=10`, { headers: getHeaders() });
        const data = await res.json();
        document.getElementById('deliveries-list').innerHTML = (data.items ? data.items : []).map(d => `
          <tr class="border-b">
            <td class="p-2 font-mono text-xs">${d.id}</td>
            <td class="p-2">
              <span class="px-2 py-1 rounded text-xs text-white ${d.status==='succeeded'?'bg-green-500':d.status==='failed'?'bg-yellow-500':d.status==='dead'?'bg-red-500':'bg-gray-400'}">
                ${d.status}
              </span>
            </td>
            <td class="p-2">${d.attempts}</td>
            <td class="p-2">
              <button onclick="replay('${d.id}')" class="text-blue-600 hover:underline">Replay</button>
            </td>
          </tr>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function replay(id) {
      await fetch(`${apiUrl()}/v1/deliveries/${id}/replay`, { method: 'POST', headers: getHeaders() });
      loadDeliveries();
    }
  </script>
</body>
</html>
